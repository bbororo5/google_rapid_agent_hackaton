[project]
name = "launchpilot-api"
version = "0.1.0"
description = "Portfolio rebuild API for evidence-grounded marketing analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/launchpilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
