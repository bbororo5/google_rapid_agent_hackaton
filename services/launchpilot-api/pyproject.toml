[project]
name = "launchpilot-api"
version = "0.1.0"
description = "Portfolio rebuild API for evidence-grounded marketing analysis"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43,<47",
    "elasticsearch>=9.0,<10.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langchain>=1.2,<2.0",
    "langchain-google-genai>=4.0,<5.0",
    "langgraph>=1.0,<2.0",
    "openinference-instrumentation-langchain>=0.1,<1.0",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.60b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.60b0,<1.0",
    "opentelemetry-instrumentation-psycopg>=0.60b0,<1.0",
    "opentelemetry-sdk>=1.39,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "PyYAML>=6.0,<7.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.12,<1.0",
]

[project.scripts]
launchpilot-seed-synthetic = "launchpilot.devtools.synthetic_marketing:main"
launchpilot-build-golden = "launchpilot.evaluation.golden_builder:main"
launchpilot-run-retrieval-evals = "launchpilot.evaluation.experiments.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/launchpilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
